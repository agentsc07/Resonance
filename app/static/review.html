<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flag review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#08080b;--ink:#f2f0ea;--ink2:#b4b1a8;--ink3:#7b7870;--line:rgba(255,255,255,.12);--gold:#f0c05a;--gold2:#d79a2b;--coral:#ff6b5e;--green:#b6e04a;--panel:#101014}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 20px 80px}
h1{font:600 30px/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px}
.sub{color:var(--ink2);margin:0 0 20px;max-width:64ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
button{background:#17171c;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:rgba(240,192,90,.55)}
button.go{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#18120a;border:0;font-weight:700}
button.v.on.agree{background:var(--green);color:#10140a;border-color:var(--green)}
button.v.on.disagree{background:var(--coral);color:#1a0a08;border-color:var(--coral)}
button.v.on.unsure{background:var(--gold);color:#18120a;border-color:var(--gold)}
input{background:#0c0c10;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:240px}
.what{flex:1;min-width:220px}.what b{font-weight:600}.what span{color:var(--ink3);font-size:14px;display:block}
.sum{color:var(--ink2);margin:0 0 16px}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Flag review</h1>
  <p class="sub">These are moments the engine flagged that none of the listeners marked. Play each one (one second either side) and say whether you agree that something is off there.</p>
  <div id="s0" class="panel"><label for="nm">Your name</label><input id="nm" autocomplete="off"><button class="go" id="go">Open</button><span id="e" style="color:var(--coral)"></span></div>
  <div id="sum" class="sum hide"></div>
  <div id="list"></div>
</main>
<script src="/static/js/review.js" type="module"></script>
</body>
</html>
