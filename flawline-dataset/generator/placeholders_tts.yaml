# Baseline registry (v1 dev set).
#
# STATUS: every entry is a `placeholder_tts` baseline: an ORIGINAL script (CC0) rendered with a macOS
# system voice whose locale matches the target accent. It exists so the flaw factory and the review
# dashboard can be built and tuned today. Spec rule "no synthetic baselines" still applies to the
# frozen v1.0 set: replace each placeholder with a real champion recording (see candidates.yaml)
# keeping the same id and slot (age band / origin / register), then set status: real.
#
# Coverage axes (spec "Who"): age band x origin/accent x register (slang level) x genre x gender.
#   age_band : speaker age band the slot is meant to cover. TTS cannot sound its age, so for
#              placeholders this is the TARGET slot, not a property of the audio.
#   register : formal | neutral | colloquial | slang-heavy
#   slang_terms: informal/dialect terms in the script. Never scored (spec: vocabulary is not scored),
#              they exist so the dashboard can filter and so WORD_SWAP is never confused with slang.

baselines:
  - id: B01
    title: "The Lighthouse Keeper"
    genre: interpretive reading
    voice: Samantha
    gender: F
    age_band: "26-45"
    origin: "United States"
    accent: "General American"
    register: neutral
    slang_terms: []
    text: >-
      The lighthouse stood at the edge of the world, or so the villagers believed. Every evening, before the fog rolled in,
      the keeper climbed the two hundred and twelve steps to light the lamp. Nobody thanked him; nobody noticed, until the
      night he was late. That night, three fishing boats drifted toward the rocks in total darkness, and the whole harbour
      learned what a small light can hold back. When he finally arrived, breathless and apologetic, no one scolded him. They
      simply stood in the cold and watched the beam sweep over the water, steady and unhurried, like a promise being kept.
      Some duties are invisible only because they are performed so faithfully. Remember that, the next time the dark seems quiet.

  - id: B02
    title: "Not Yet Begun"
    genre: declamation
    voice: Daniel
    gender: M
    age_band: "46-65"
    origin: "United Kingdom"
    accent: "British RP"
    register: formal
    slang_terms: []
    text: >-
      Friends, countrymen, fellow citizens: we meet at an hour when doubt is cheap and courage is dear. It is easy to be
      eloquent about success; it is far harder to be steadfast in adversity. Yet history does not remember those who
      hesitated at the threshold. It remembers the indefatigable, the stubborn, the ones who rose each morning and resumed
      the work as though yesterday's defeat had been a mere rehearsal. Let us not mistake difficulty for destiny. The road
      is long, the weather is foul, and the hour is late; but we are here, and we are many, and we have not yet begun to
      give our best. Therefore let us go forward, with resolve in our hearts and sovereignty over our own fear.

  - id: B03
    title: "Placement Season"
    genre: extemporaneous
    voice: Rishi
    gender: M
    age_band: "18-25"
    origin: "India (Hindi belt)"
    accent: "Indian English (Hindi-belt)"
    register: slang-heavy
    slang_terms: ["vibe check", "grinding", "cooked", "no cap", "ghost", "flex", "touch grass", "yaar", "bro", "bounced back"]
    text: >-
      Okay so, honestly, guys, placements season was a total vibe check. Like, everybody's stressing, everybody's grinding,
      and half the class is just pretending they're chill. But here's the thing, yaar: nobody is a lone wolf in this. My
      roommate bombed his first interview, totally cooked, and he still bounced back and cracked the next one. No cap. So if
      you're feeling stuck, don't ghost your own goals. Take it one step at a time, keep it real, and ask for help when you
      need it. Seriously, the grind is only a flex if you're not burning out. Anyway, that's my two cents, bro. Go touch
      some grass, then come back and crush it.

  - id: B04
    title: "The Water in Our Taps"
    genre: persuasive oratory
    voice: Tara
    gender: F
    age_band: "26-45"
    origin: "India (metro)"
    accent: "Indian English (metro)"
    register: formal
    slang_terms: []
    text: >-
      Honourable members and fellow citizens, I rise today to speak about something we all use and rarely question: the
      water in our taps. In nearly every district, a child still walks two kilometres for a single bucket. Think about that.
      Think about the hours lost, the schooling forgone, the potential quietly drained away. We have the engineers. We have
      the funds. What we lack is urgency. I am not asking for charity; I am asking for accountability. Let us commit, this
      very year, to a plan with deadlines, with budgets, and with names attached to every promise. Because a nation that
      cannot quench its own thirst cannot claim to be building a future.

  - id: B05
    title: "One Cup of Filter Coffee"
    genre: extemporaneous
    voice: Vani
    gender: F
    age_band: "46-65"
    origin: "India (Tamil Nadu)"
    accent: "Tamil English"
    register: colloquial
    slang_terms: ["what to say", "no", "phones only", "isn't it", "WhatsApp", "thirty years back"]
    text: >-
      Good evening everyone, I am very happy to see so many of you here today, what to say. When I first came to this colony
      thirty years back, there was only one tea shop and one bus, and both were always late. But people were good, no? If
      somebody fell sick, the whole street would come with food and medicine. Now everyone is busy with their phones only. I
      am not saying phones are bad, I also use WhatsApp daily. Only thing is, let us not forget to knock on the neighbour's
      door. A small chat, one cup of filter coffee, that itself is enough to keep a community alive, isn't it?

  - id: B06
    title: "The Last of the Storytellers"
    genre: persuasive oratory
    voice: Moira
    gender: F
    age_band: "65+"
    origin: "Ireland"
    accent: "Irish English"
    register: formal
    slang_terms: ["so we have", "sure look", "sure"]
    text: >-
      Now, I've lived long enough to know that a story told once is a story half-lost. My grandmother had a tale for every
      field and every hedgerow, and she'd tell them by the fire, slow and sure, as if the words were embers she was afraid
      to scatter. We've gone and swapped the fire for a screen, so we have. And I'm not scolding anybody, sure look, we all
      do it. But I'm asking you tonight to sit with the old people, to ask them the question you think you already know the
      answer to. Because when the last of them is gone, so is the music, and no cacophony of modern noise will ever fill
      that silence.

  - id: B07
    title: "Sit a Spell"
    genre: interpretive reading
    voice: Ralph
    gender: M
    age_band: "65+"
    origin: "United States (South)"
    accent: "Southern American"
    register: colloquial
    slang_terms: ["reckon", "ain't", "fixin' to", "y'all", "sit a spell", "granddaddy", "'cause", "folks"]
    text: >-
      Well now, I reckon every porch has a story, and ours was no different. My granddaddy used to sit out there every
      evening, whittling on a piece of cedar, and he'd say, son, ain't nothing in this world worth hurrying for except
      supper. We thought he was just an old man talking. Turns out he was fixin' to teach us something. The corn don't grow
      faster 'cause you stare at it, and folks don't heal quicker 'cause you fuss. Y'all keep that in mind when the world
      starts pushing. Sit a spell. Breathe. The good stuff, it comes round in its own sweet time.

  - id: B08
    title: "Turn the Tide"
    genre: declamation
    voice: Karen
    gender: F
    age_band: "18-25"
    origin: "Australia"
    accent: "Australian English"
    register: slang-heavy
    slang_terms: ["g'day", "heaps", "rocking up", "arvo", "reckon", "fair dinkum", "mates", "legends", "smash it", "you name it"]
    text: >-
      G'day everyone, thanks heaps for rocking up this arvo. Look, I reckon we've all seen the state of our beaches, and fair
      dinkum, it's not good enough. Every weekend there's a mountain of plastic, chip packets, bottle tops, you name it,
      washing up like it's some kind of bad joke. But here's the good news, mates: this crew right here picked up heaps of
      rubbish last month, and not one of us got paid a cent. Absolute legends. So grab a bag, grab a mate, and let's smash
      it. It's not about being perfect; it's about turning up, again and again, until the tide turns our way.
